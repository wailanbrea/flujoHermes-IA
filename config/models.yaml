models:
  classifier:
    id: google/gemma-4-12b-qat
    alias: gemma
    role: classification_context
    context_tokens: 16384
    max_output_tokens: 4096
    gpu_offload: max

  low_risk_coder:
    id: google/gemma-4-12b-qat
    alias: gemma
    role: low_risk_programming
    context_tokens: 16384
    max_output_tokens: 4096
    gpu_offload: max

  primary_coder:
    id: agents-a1-4b
    alias: agents-a1
    role: primary_programming
    context_tokens: 16384
    max_output_tokens: 6144
    gpu_offload: max

  escalation_coder:
    id: qwen3.6-35b-a3b-uncensored-hauhaucs-aggressive
    alias: qwen
    role: failed_task_recovery
    context_tokens: 24576
    max_output_tokens: 8192
    gpu_offload: "0.50"
    ttl_seconds: 900

model_residency:
  minimum_free_vram_mb: 2048
  unload_idle_models: true
  idle_timeout_seconds: 300
